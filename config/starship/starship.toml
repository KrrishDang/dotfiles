"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$cmd_duration\
$line_break\
$character
"""

# ==========================================
# Directory
# ==========================================

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

# ==========================================
# Character
# ==========================================

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"

# ==========================================
# Git
# ==========================================

[git_branch]
symbol = " "
style = "bold bright-black"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style)) "

# ==========================================
# Python
# ==========================================

[python]
symbol = " "
format = "[$symbol($virtualenv )]($style)"
style = "yellow"

# ==========================================
# Node.js
# ==========================================

[nodejs]
symbol = "󰎙 "
format = "[$symbol($version )]($style)"
style = "green"

# ==========================================
# Command Duration
# ==========================================

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[⏱ $duration]($style) "

# ==========================================
# Disable Unused Modules
# ==========================================

[aws]
disabled = true

[gcloud]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[package]
disabled = true

[hostname]
disabled = true

[username]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[time]
disabled = true
