# ==========================================================
# TMUX OPTIONS
# Core tmux behavior and defaults
# ==========================================================

# ----------------------------------------------------------
# Prefix
# ----------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----------------------------------------------------------
# Terminal
# ----------------------------------------------------------

set -g default-terminal "tmux-256color"

# Enable True Color (RGB)
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB,alacritty:RGB,wezterm:RGB,kitty:RGB"

# ----------------------------------------------------------
# General
# ----------------------------------------------------------

# Mouse support
set -g mouse on

# Notify applications when tmux gains/loses focus
set -g focus-events on

# Remove ESC delay (better Vim experience)
set -sg escape-time 0

# Support extended keyboard sequences
set -g extended-keys on

# Large scrollback history
set -g history-limit 100000

# Don't exit tmux when a session is destroyed if others remain
set -g detach-on-destroy off

# ----------------------------------------------------------
# Windows & Panes
# ----------------------------------------------------------

# Start numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Automatically rename windows based on running program
setw -g automatic-rename on

# Prevent applications from overriding window names
setw -g allow-rename off

# Resize windows to fit the active client
setw -g aggressive-resize on

# ----------------------------------------------------------
# Clipboard
# ----------------------------------------------------------

# Use the system clipboard
set -s set-clipboard on

# ----------------------------------------------------------
# Copy Mode
# ----------------------------------------------------------

# Use Vim keybindings
setw -g mode-keys vi

# ----------------------------------------------------------
# Status Bar
# ----------------------------------------------------------

# Place the status bar at the top
set -g status-position top

# Refresh every 2 seconds
set -g status-interval 2

# ----------------------------------------------------------
# Activity Monitoring
# ----------------------------------------------------------

set -g monitor-activity on
set -g visual-activity off

# ----------------------------------------------------------
# Timing
# ----------------------------------------------------------

# Time allowed for repeating prefix commands
set -g repeat-time 600

# Display pane numbers duration
set -g display-panes-time 800

# Display message duration
set -g display-time 2000
