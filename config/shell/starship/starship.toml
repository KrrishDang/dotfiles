"$schema" = "https://starship.rs/config-schema.json"

# ==================================================
# General
# ==================================================

add_newline = false
command_timeout = 1000
palette = "catppuccin_mocha"

format = """
$directory$character
"""

right_format = """
$python\
$nodejs\
$git_branch\
$git_status\
$cmd_duration
"""

# ==================================================
# Character
# ==================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# ==================================================
# Directory
# ==================================================

[directory]
style = "bold blue"
truncation_length = 5
truncate_to_repo = true
read_only = "󰌾"

[directory.substitutions]
"~/Projects" = "Projects"
"~/Development" = "Dev"
"~/Downloads" = "Downloads"

# ==================================================
# Git
# ==================================================

[git_branch]
symbol = " "
style = "bold lavender"
format = "[$symbol$branch(:$remote_branch)]($style)"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style))"

# ==================================================
# Python
# ==================================================

[python]
symbol = " "
style = "bold yellow"
python_binary = ["python3", "python"]
format = "[$symbol$version( ($virtualenv))]($style)"

# ==================================================
# Node.js
# ==================================================

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style)"

# ==================================================
# Command Duration
# ==================================================

[cmd_duration]
min_time = 2000
style = "bold peach"
format = "[⏱ $duration]($style)"

# ==================================================
# Disabled Modules
# ==================================================

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true

[battery]
disabled = true

[hostname]
disabled = true

[username]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[time]
disabled = true

[jobs]
disabled = true

[status]
disabled = true

[shell]
disabled = true

[line_break]
disabled = true

