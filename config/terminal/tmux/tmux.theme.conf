# ==========================================================
# TMUX THEME
# Catppuccin Mocha
#
# This file contains ONLY appearance-related settings.
# Status modules and their content belong in tmux.modules.conf.
# ==========================================================

# ----------------------------------------------------------
# Catppuccin Flavor
# ----------------------------------------------------------

set -g @catppuccin_flavor "mocha"

# ----------------------------------------------------------
# Status Bar Appearance
# ----------------------------------------------------------

# Transparent background
set -g @catppuccin_status_background "none"

# ----------------------------------------------------------
# Window Style
# ----------------------------------------------------------

# Rounded window tabs
set -g @catppuccin_window_status_style "rounded"

# Rounded separators
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""

# Space between windows
set -g @catppuccin_window_middle_separator " "

# Show window number on the right
set -g @catppuccin_window_number_position "right"

# Fill style
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

# ----------------------------------------------------------
# Nerd Font
# ----------------------------------------------------------

set -g @tmux-nerd-font true

# Display only application icons in window tabs
set -g @tmux-nerd-font-window-name-show-name false
set -g @tmux-nerd-font-window-name-show-icon true

# ----------------------------------------------------------
# Pane Borders
# ----------------------------------------------------------

set -g pane-border-status off
set -g pane-border-lines single

# ----------------------------------------------------------
# Popup Windows
# ----------------------------------------------------------

set -g popup-border-lines rounded
