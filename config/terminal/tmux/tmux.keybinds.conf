# ==========================================================
# TMUX KEYBINDINGS
# ==========================================================

# ----------------------------------------------------------
# Reload Configuration
# ----------------------------------------------------------

bind r source-file ~/dotfiles/config/tmux/tmux.conf \; display-message "󰑓 tmux config reloaded"

# ----------------------------------------------------------
# Sessions
# ----------------------------------------------------------

bind S choose-session

bind C-a last-window

bind w list-windows
bind W choose-window

# ----------------------------------------------------------
# Windows
# ----------------------------------------------------------

bind c new-window -c "#{pane_current_path}"

bind R command-prompt -I "#W" "rename-window '%%'"

bind & confirm-before -p "Kill window #W? (y/n)" kill-window

bind H previous-window
bind L next-window

# ----------------------------------------------------------
# Panes
# ----------------------------------------------------------

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind x swap-pane -D

bind z resize-pane -Z

bind X confirm-before -p "Kill pane? (y/n)" kill-pane

bind * setw synchronize-panes \; display-message "Pane sync toggled"

# ----------------------------------------------------------
# Resize Panes
# ----------------------------------------------------------

bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

bind -r < resize-pane -L 10
bind -r > resize-pane -R 10
bind -r - resize-pane -D 10
bind -r + resize-pane -U 10

# ----------------------------------------------------------
# Copy Mode
# ----------------------------------------------------------

bind Enter copy-mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# ----------------------------------------------------------
# Clipboard
# ----------------------------------------------------------

bind P paste-buffer

# ----------------------------------------------------------
# Floax
# ----------------------------------------------------------

bind p run-shell "~/.tmux/plugins/tmux-floax/scripts/floax.sh"

# ----------------------------------------------------------
# SessionX
# ----------------------------------------------------------

bind f run-shell "~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

# ----------------------------------------------------------
# FZF
# ----------------------------------------------------------

bind F run-shell "~/.tmux/plugins/tmux-fzf/scripts/session.sh"

# ----------------------------------------------------------
# Thumbs
# ----------------------------------------------------------

bind T run-shell "~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh"

# ----------------------------------------------------------
# Refresh
# ----------------------------------------------------------

bind C-l refresh-client

# ----------------------------------------------------------
# Utilities
# ----------------------------------------------------------

bind K send-keys C-l

bind ? list-keys
