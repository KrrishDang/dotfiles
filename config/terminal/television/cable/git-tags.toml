[metadata]
name = "git-tags"
description = "Browse Git tags."
requirements = ["git"]

[source]
command = "git tag --sort=-creatordate"
no_sort = true
frecency = false

[preview]
command = "git show --color=always '{}'"

[keybindings]
enter = "actions:checkout"

[actions.checkout]
description = "Checkout selected tag"
command = "git checkout '{}'"
mode = "execute"
