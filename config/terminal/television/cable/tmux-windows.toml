[metadata]
name = "tmux-windows"
description = "Browse and manage tmux windows."
requirements = ["tmux"]

[source]
command = "tmux list-windows -a -F '#{session_name}:#{window_index}\t#{window_name}\t#{pane_current_command}'"
display = "{split:\t:0} - {split:\t:1} ({split:\t:2})"
output = "{split:\t:0}"

[preview]
command = "tmux capture-pane -t '{split:\t:0}' -p 2>/dev/null | tail -200"

[keybindings]
enter = "actions:switch"
ctrl-k = "actions:kill"

[actions.switch]
description = "Switch to selected window"
command = "tmux select-window -t '{split:\t:0}'"
mode = "execute"

[actions.kill]
description = "Kill selected window"
command = "tmux kill-window -t '{split:\t:0}'"
mode = "fork"
