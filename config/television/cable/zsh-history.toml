[metadata]
name = "zsh-history"
description = "Browse your Zsh command history."
requirements = ["zsh"]

[source]
command = "sed '1!G;h;$!d' ${HISTFILE:-${HOME}/.zsh_history}"
display = "{split:;:1..}"
output = "{split:;:1..}"
no_sort = true
frecency = false

[keybindings]
enter = "actions:execute"

[actions.execute]
description = "Execute selected command"
command = "zsh -ic '{split:;:1..}'"
mode = "execute"
