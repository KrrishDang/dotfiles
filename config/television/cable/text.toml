[metadata]
name = "text"
description = "Search text across files."
requirements = ["rg", "bat"]

[source]
command = [
    "rg . --no-heading --line-number --color=always --colors 'match:fg:white' --colors 'path:fg:blue'",
    "rg . --no-heading --line-number --hidden --color=always --colors 'match:fg:white' --colors 'path:fg:blue'",
]
ansi = true
output = "{strip_ansi|split:\\::..2}"

[preview]
command = "bat --style=plain --color=always '{strip_ansi|split:\\::0}'"
offset = "{strip_ansi|split:\\::1}"

[ui]
preview_panel = { header = "{strip_ansi|split:\\::..2}" }

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Open file in Neovim at matching line"
command = "nvim '+{strip_ansi|split:\\::1}' '{strip_ansi|split:\\::0}'"
mode = "execute"
