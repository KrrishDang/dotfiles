[metadata]
name = "env"
description = "Browse and inspect environment variables."

[source]
command = "printenv"
output = "{split:=:1..}"

[preview]
command = "echo '{split:=:1..}'"

[ui]
layout = "portrait"
preview_panel = { size = 25, header = "{split:=:0}" }

[keybindings]
shortcut = "f3"

[actions.name]
description = "Copy variable name"
command = "echo '{split:=:0}'"
mode = "execute"
