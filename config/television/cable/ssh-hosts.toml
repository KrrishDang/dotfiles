[metadata]
name = "ssh-hosts"
description = "Browse SSH hosts from your SSH configuration."
requirements = ["grep", "tr", "cut", "awk", "ssh"]

[source]
command = "grep -E '^Host(name)? ' $HOME/.ssh/config | tr -s ' ' | cut -d' ' -f2- | tr ' ' '\n' | grep -v '^$'"

[preview]
command = "awk '/^Host / { found=0 } /^Host (.*[[:space:]])?{}([[:space:]].*)?$/ { found=1 } found' $HOME/.ssh/config"

[keybindings]
enter = "actions:connect"

[actions.connect]
description = "Connect to selected SSH host"
command = "ssh '{}'"
mode = "execute"
